name: Deploy

# Merging to main deploys the Worker to flare.tangent.workers.dev, after the unit
# tests pass. It needs one repository secret, CLOUDFLARE_API_TOKEN (a Cloudflare
# API token made from the "Edit Cloudflare Workers" template). Without it the
# deploy step is skipped with a note, so nothing fails before it is set up.
# The Worker's own secrets (WRITE_TOKEN, CLOUDFLARE_IMAGE_TOKEN) live in
# Cloudflare and are left as they are by a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 41f6f507a22c7eec431dbc5e9670c73d   # the account (also CLOUDFLARE_ID in wrangler.toml)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npx wrangler deploy
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN repository secret to deploy on merge (see README)."
